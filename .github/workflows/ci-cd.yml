name: Customer Loyalty Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: customer_loyalty
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure database
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application.properties <<EOF
          spring.datasource.url=jdbc:mysql://localhost:3306/customer_loyalty
          spring.datasource.username=root
          spring.datasource.password=root
          spring.jpa.hibernate.ddl-auto=create-drop
          spring.jpa.show-sql=false
          EOF

      - name: Build and test
        run: mvn clean verify -B

      - name: Build Docker image
        run: docker build -t customer-loyalty-backend .

      - name: Check Docker image
        run: docker images customer-loyalty-backend
